name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
    - run: npm ci
    - run: npm test
